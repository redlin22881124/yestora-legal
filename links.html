<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>昨日衣櫥</title>
  <meta name="description" content="智慧電子衣櫥與穿搭推薦" />
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      --sage: #898e77;
      --cream: #f4efe6;
      --ink: #111;
      --muted: #3a3a3a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: var(--sage);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei",
        "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    .card {
      width: min(28rem, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 3.25rem 1.35rem 2.5rem;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @media (min-width: 480px) {
      body { padding: 1.5rem 0; align-items: center; }
      .card {
        min-height: auto;
        border-radius: 1.75rem;
        padding-top: 3.5rem;
        padding-bottom: 3rem;
      }
    }
    .avatar {
      width: 6.5rem;
      height: 6.5rem;
      border-radius: 50%;
      object-fit: cover;
      background: var(--sage);
      display: block;
    }
    h1 {
      margin: 1.15rem 0 0.35rem;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin: 0 0 1.75rem;
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--muted);
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 3.35rem;
      padding: 0.7rem 1rem;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      border: 2px solid #111;
      border-radius: 0.85rem;
      box-shadow: 4px 4px 0 #111;
      font-weight: 800;
      font-size: 1.02rem;
    }
    .link:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 #111; }
    .link:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #111; }
    .link svg {
      width: 1.35rem;
      height: 1.35rem;
      flex: 0 0 auto;
    }
    .link span {
      flex: 1;
      text-align: center;
      padding-right: 1.35rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="logo.png" width="104" height="104" alt="昨日衣櫥" />
    <h1>昨日衣櫥</h1>
    <p class="tagline">智慧電子衣櫥與穿搭推薦</p>
    <nav class="links" aria-label="下載與法律">
      <a
        class="link"
        href="https://apps.apple.com/app/%E6%98%A8%E6%97%A5%E8%A1%A3%E6%AB%A5-%E6%99%BA%E6%85%A7%E9%9B%BB%E5%AD%90%E8%A1%A3%E6%AB%A5%E8%88%87%E7%A9%BF%E6%90%AD%E6%8E%A8%E8%96%A6/id6794158074"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.4-1-2.5-3.6zM14.6 6.6c.6-.8 1.1-1.9.9-3-1 .1-2.2.7-2.9 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.3-.5 3-1.4z"/>
        </svg>
        <span>下載 iOS 版</span>
      </a>
      <a
        class="link"
        href="https://play.google.com/store/apps/details?id=com.yesterdaywardrobe.app"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4.3 2.4c-.3.2-.5.6-.5 1.1v16.9c0 .5.2.9.5 1.1l8.8-9.6L4.3 2.4zm.9 18.9 7.3-4.2-1.7-1.8-5.6 6zm7.9-9.1 2.1 1.2 3.8-2.2c.6-.3.6-1.3 0-1.7l-3.8-2.2-2.1 1.2 3.8 2.5-3.8 2.2zm-1.3-.5L4.5 2.7l5.6 6 1.7-1.8z"/>
        </svg>
        <span>下載 Android 版</span>
      </a>
      <a class="link" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 3.2 3 11h2.2v8.5h5.1V14.6h3.4v4.9h5.1V11H21L12 3.2z"/>
        </svg>
        <span>隱私政策 &amp; 服務條款</span>
      </a>
    </nav>
  </main>
</body>
</html>
