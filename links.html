<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>昨日衣櫥</title>
  <meta name="description" content="智慧電子衣櫥與穿搭推薦" />
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      --sage: #898e77;
      --cream: #f4efe6;
      --ink: #111;
      --muted: #3a3a3a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: var(--sage);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei",
        "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
    }
    .card {
      width: min(28rem, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 3.25rem 1.35rem 2.5rem;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @media (min-width: 480px) {
      body { padding: 1.5rem 0; align-items: center; }
      .card {
        min-height: auto;
        border-radius: 1.75rem;
        padding-top: 3.5rem;
        padding-bottom: 3rem;
      }
    }
    .avatar {
      width: 6.5rem;
      height: 6.5rem;
      border-radius: 50%;
      object-fit: cover;
      background: var(--sage);
      display: block;
    }
    h1 {
      margin: 1.15rem 0 0.35rem;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .tagline {
      margin: 0 0 1.75rem;
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--muted);
    }
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 3.35rem;
      padding: 0.7rem 1rem;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      border: 2px solid #111;
      border-radius: 0.85rem;
      box-shadow: 4px 4px 0 #111;
      font-weight: 800;
      font-size: 1.02rem;
    }
    .link:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 #111; }
    .link:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #111; }
    .link .icon {
      width: 1.55rem;
      height: 1.55rem;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }
    .link .icon svg {
      display: block;
      overflow: visible;
    }
    .link .icon-apple svg { width: 1.95rem; height: 1.95rem; }
    .link .icon-android svg { width: 1.36rem; height: 1.36rem; }
    .link .icon-doc svg { width: 1.46rem; height: 1.46rem; }
    .link .label {
      flex: 1;
      text-align: center;
      padding-right: 1.55rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="logo.png" width="104" height="104" alt="昨日衣櫥" />
    <h1>昨日衣櫥</h1>
    <p class="tagline">智慧電子衣櫥與穿搭推薦</p>
    <nav class="links" aria-label="下載與法律">
      <a

        href="https://apps.apple.com/app/%E6%98%A8%E6%97%A5%E8%A1%A3%E6%AB%A5-%E6%99%BA%E6%85%A7%E9%9B%BB%E5%AD%90%E8%A1%A3%E6%AB%A5%E8%88%87%E7%A9%BF%E6%90%AD%E6%8E%A8%E8%96%A6/id6794158074"
      >
        <span class="icon icon-apple" aria-hidden="true">
          <svg viewBox="5.4 2.4 13.2 19.6">
            <path fill="currentColor" d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.4-1-2.5-3.6zM14.6 6.6c.6-.8 1.1-1.9.9-3-1 .1-2.2.7-2.9 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.3-.5 3-1.4z"/>
          </svg>
        </span>
        <span class="label">在 App Store 下載</span>
      </a>
      <a
        class="link"
        href="https://play.google.com/store/apps/details?id=com.yesterdaywardrobe.app"
      >
        <span class="icon icon-android" aria-hidden="true">
          <svg viewBox="1.5 0 21 24">
            <path fill="currentColor" d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84 1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z"/>
          </svg>
        </span>
        <span class="label">在 Google Play 下載</span>
      </a>
      <a class="link" href="index.html">
        <span class="icon icon-doc" aria-hidden="true">
          <svg viewBox="3.6 1.6 16.8 20.8">
            <path fill="currentColor" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm1 7V3.5L18.5 9H15zM8 13h8v1.6H8V13zm0 3h8v1.6H8V16zM8 10h4v1.6H8V10z"/>
          </svg>
        </span>
        <span class="label">隱私政策 &amp; 服務條款</span>
      </a>
    </nav>
  </main>
</body>
</html>
