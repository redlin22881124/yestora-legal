    :root {
      --ink: #2c2a26;

      --bg: #f3f0e8;
      --panel: #fffdf8;
      --line: #d9d2c3;
      --accent: #898e77;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti TC",
        "Noto Serif TC", serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e7ebe0 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #efe6d8 0%, transparent 50%),
        var(--bg);
      line-height: 1.7;
    }
    header {
      padding: 2.5rem 1.25rem 1rem;
      max-width: 42rem;
      margin: 0 auto;
    }
    .brand {
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      margin: 0 0 0.75rem;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0 0 0.35rem;
      font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 0.95rem; margin: 0; }
    nav {
      display: flex;
      gap: 1rem;
      margin-top: 1.25rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.95rem;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    nav a:hover, nav a[aria-current="page"] {
      border-bottom-color: var(--accent);
      color: var(--accent);
    }
    main {
      max-width: 42rem;
      margin: 0 auto 3rem;
      padding: 1.5rem 1.25rem 2.5rem;
      background: color-mix(in srgb, var(--panel) 92%, white);
      border: 1px solid var(--line);
      border-radius: 1rem;
    }
    h2 {
      font-size: 1.15rem;
      margin: 1.75rem 0 0.6rem;
    }
    p { margin: 0 0 0.75rem; color: #3a372f; }
    footer {
      max-width: 42rem;
      margin: 0 auto 3rem;
      padding: 0 1.25rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    footer a { color: var(--accent); }
  </style>
</head>
