  <style>
    :root { --sage: #898e77; --cream: #f4efe6; --ink: #111; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--sage);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);

    main {

  <script>
    (function () {
      var ios = "https://apps.apple.com/app/id6794158074";
      var play = "https://play.google.com/store/apps/details?id=com.yesterdaywardrobe.app";
      var ua = navigator.userAgent || "";
      var iPadOs = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      if (/iPhone|iPad|iPod/i.test(ua) || iPadOs) {
        location.replace(ios);
        return;
      }
      if (/Android/i.test(ua)) {
